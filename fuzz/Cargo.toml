[package]
name = "rdjvu-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rdjvu-iff = { path = "../rdjvu-iff" }
rdjvu-zp = { path = "../rdjvu-zp" }
rdjvu-bzz = { path = "../rdjvu-bzz" }
rdjvu-jb2 = { path = "../rdjvu-jb2" }
rdjvu-iw44 = { path = "../rdjvu-iw44" }
rdjvu-document = { path = "../rdjvu-document" }
rdjvu-render = { path = "../rdjvu-render" }

[workspace]

# Prevent this from interfering with workspace in the parent directory
[patch.crates-io]

[[bin]]
name = "fuzz_iff"
path = "fuzz_targets/fuzz_iff.rs"
doc = false

[[bin]]
name = "fuzz_zp"
path = "fuzz_targets/fuzz_zp.rs"
doc = false

[[bin]]
name = "fuzz_bzz"
path = "fuzz_targets/fuzz_bzz.rs"
doc = false

[[bin]]
name = "fuzz_jb2"
path = "fuzz_targets/fuzz_jb2.rs"
doc = false

[[bin]]
name = "fuzz_iw44"
path = "fuzz_targets/fuzz_iw44.rs"
doc = false

[[bin]]
name = "fuzz_full"
path = "fuzz_targets/fuzz_full.rs"
doc = false
