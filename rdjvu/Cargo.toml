[package]
name = "rdjvu"
version = "0.1.0"
edition = "2021"
authors = ["Rafael Bagmanov <bugzmanov@gmail.com>"]
license = "GPL-3.0-or-later"
description = "Pure Rust DjVu document reader and renderer"
repository = "https://github.com/bugzmanov/rdjvu"
readme = "../README.md"
keywords = ["djvu", "document", "renderer", "image", "parser"]
categories = ["multimedia::images", "parser-implementations"]
exclude = ["references/", "tests/golden/", "fuzz/", "*.djvu"]

[dependencies]
rdjvu-core = { path = "../rdjvu-core" }
rdjvu-document = { path = "../rdjvu-document" }
rdjvu-render = { path = "../rdjvu-render" }
self_cell = "1.2"

[dev-dependencies]
rdjvu-document = { path = "../rdjvu-document" }
rdjvu-iff = { path = "../rdjvu-iff" }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "render"
harness = false
